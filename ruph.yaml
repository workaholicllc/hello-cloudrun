app: hello-cloudrun
envs:
  qa:
    region: southamerica-east1
    cpu: "1"
    memory: 512Mi
    min: 0
    max: 1
    port: 8080
    health_path: /health
    public: true
    env: { NODE_ENV: production }
    secrets: {}
  prod:
    region: southamerica-east1
    cpu: "1"
    memory: 512Mi
    min: 0
    max: 2
    port: 8080
    health_path: /health
    env: { NODE_ENV: production }
    secrets: {}
